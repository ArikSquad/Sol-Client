plugins {
	id 'java-library'
}


dependencies {
	compileOnly 'org.lwjgl:lwjgl-opengl:3.3.1'
	compileOnly 'org.lwjgl:lwjgl-stb:3.3.1'
	compileOnly libs.lwjgl.nanovg

	api files(rootProject.file('libs/occlusionculling.jar'))
	api 'net.hypixel:hypixel-api-core:4.0'
	api 'com.github.JnCrMx:discord-game-sdk4j:v0.5.4'
	api 'org.java-websocket:Java-WebSocket:1.5.3'
	api 'org.apache.httpcomponents:httpclient:4.5.13'
	api 'net.fabricmc:sponge-mixin:0.11.4+mixin.0.8.5'
	api 'com.github.LlamaLad7:MixinExtras:0.1.1'
	api 'org.ow2.asm:asm:9.9.1'
	api 'org.ow2.asm:asm-tree:9.9.1'
	api 'org.ow2.asm:asm-commons:9.9.1'
	api 'org.ow2.asm:asm-util:9.9.1'
	api 'com.google.code.gson:gson:2.13.2'
	api 'com.google.guava:guava:33.4.8-jre'
	api 'commons-io:commons-io:2.20.0'
	api 'org.apache.commons:commons-lang3:3.18.0'
	api 'org.jetbrains:annotations:26.0.2'
	api 'com.github.Sol-Client:Quilt-Stub:451a0dc4b6'

	compileOnly 'org.apache.logging.log4j:log4j-api:2.25.2'
	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.release = 8
}

plugins {
	// 26.2 has no remapping step: Minecraft and mods use official names.
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

def minecraftVersion = '26.2'
def loaderVersion = '0.19.5'
def fabricApiVersion = '0.155.2+26.2'
def nanovgNatives = System.getProperty('os.name').toLowerCase().contains('win') ? 'natives-windows'
		: (System.getProperty('os.name').toLowerCase().contains('mac')
				? (System.getProperty('os.arch').toLowerCase().contains('aarch64') ? 'natives-macos-arm64' : 'natives-macos')
				: 'natives-linux')
def nanoVgVersion = '3.4.1'
def commonModResources = project(':common').file('src/main/resources/assets/sol_client')
def commonGuiResources = project(':common').file('src/main/resources/assets/minecraft/textures/gui')
def commonCrosshairResource = project(':common').file('src/main/resources/assets/minecraft/textures/gui/sol_client_crosshairs.png')

base {
	archivesName = 'sol-client-' + minecraftVersion
}

loom {
	splitEnvironmentSourceSets()
	mods {
		'sol-client' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	nanoVgNatives
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	implementation "net.fabricmc:fabric-loader:${loaderVersion}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	implementation 'org.lwjgl:lwjgl-nanovg:' + nanoVgVersion
	runtimeOnly('org.lwjgl:lwjgl-nanovg:' + nanoVgVersion + ':' + nanovgNatives) { transitive = false }
	nanoVgNatives 'org.lwjgl:lwjgl-nanovg:' + nanoVgVersion + ':natives-linux'
	nanoVgNatives 'org.lwjgl:lwjgl-nanovg:' + nanoVgVersion + ':natives-windows'
	nanoVgNatives 'org.lwjgl:lwjgl-nanovg:' + nanoVgVersion + ':natives-macos'
	nanoVgNatives 'org.lwjgl:lwjgl-nanovg:' + nanoVgVersion + ':natives-macos-arm64'
	implementation project(':common')
}

tasks.named('jar') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from { project(':common').sourceSets.main.output.classesDirs }
	from { project(':common').sourceSets.main.resources }
	from { configurations.runtimeClasspath.findAll { it.name == 'lwjgl-nanovg-' + nanoVgVersion + '.jar' }.collect { zipTree(it) } } {
		include 'org/lwjgl/nanovg/**'
	}
	from { configurations.nanoVgNatives.collect { zipTree(it) } } {
		include 'linux/**'
		include 'windows/**'
		include 'macos/**'
		include 'META-INF/linux/**'
		include 'META-INF/windows/**'
		include 'META-INF/macos/**'
	}
}

processResources {
	from project(':common').sourceSets.main.resources
	from(commonModResources) {
		into 'assets/sol-client'
	}
	from(commonGuiResources) {
		into 'assets/sol-client/textures/gui'
	}
	from(commonCrosshairResource) {
		into 'assets/sol-client'
		rename { 'crosshairs.png' }
	}
	def clientVersion = project.version.toString()
	inputs.property 'version', clientVersion
	inputs.property 'fabricApiVersion', fabricApiVersion
	filesMatching('fabric.mod.json') {
		expand version: clientVersion, fabricApiVersion: fabricApiVersion
	}
}

// The client run configuration uses the split client resources directory.
tasks.named('processClientResources') {
	from project(':common').sourceSets.main.resources
	from(commonModResources) {
		into 'assets/sol-client'
	}
	from(commonGuiResources) {
		into 'assets/sol-client/textures/gui'
	}
	from(commonCrosshairResource) {
		into 'assets/sol-client'
		rename { 'crosshairs.png' }
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}
